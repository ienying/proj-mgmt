<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户画像 · 科室档案</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#fdfcf8;--ink:#1a1a1a;--red:#b91c1c;--red-l:#fef2f2;
  --line:#d1c7b7;--line-l:#e8e0d0;--warm:#f5f0e8;--warm2:#ede4d3;
  --muted:#8b7355;--tag-bg:#fdfcf8;
}
body{font-family:"STSong","Songti SC","Noto Serif SC","PingFang SC","Microsoft YaHei",serif;background:#e8e0d0;color:var(--ink);line-height:1.8;overflow-y:scroll}

/* === TOP DOCK === */
.top-dock{position:fixed;z-index:100;left:50%;transform:translateX(-50%);top:12px;display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:12px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.top-dock .tk-logo{display:flex;align-items:center;gap:10px;padding-right:14px;margin-right:6px;border-right:1px solid var(--line)}
.top-dock .tk-logo .tk-icon{width:26px;height:26px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.top-dock .tk-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:500;white-space:nowrap;cursor:pointer;border:none;background:transparent;color:#000;font-family:inherit;transition:all .2s}
.top-dock .tk-item:hover{background:#f5f5f5}
.top-dock .tk-item.act{color:#fff;background:var(--red);box-shadow:0 2px 8px rgba(185,28,28,.2)}
.top-dock .tk-item .tk-icon{font-size:15px}
.top-dock .tk-item .tk-badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:10px;font-size:9px;font-weight:700;color:#fff;background:#ef4444;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.top-dock .tk-right{display:flex;align-items:center;gap:4px;padding-left:6px;margin-left:2px;border-left:1px solid var(--line)}
.top-dock .tk-right button{width:28px;height:28px;border-radius:6px;border:none;background:transparent;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:.15s}
.top-dock .tk-right button:hover{background:#f5f5f5}
.top-dock .tk-right .tk-user{display:flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;cursor:pointer;font-size:11px;color:#666}
.top-dock .tk-right .tk-user .tk-av{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}

/* === LEFT NAV === */
.left-nav{
  position:fixed;left:24px;top:50%;transform:translateY(-50%);z-index:30;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:14px;padding:4px;
  box-shadow:0 6px 20px rgba(0,0,0,.05);
}
.left-nav .ln-btn{
  position:relative;display:flex;align-items:center;justify-content:center;
  width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;
  background:transparent;color:#999;font-size:13px;transition:all .2s;
}
.left-nav .ln-btn:hover{background:var(--warm);color:var(--ink)}
.left-nav .ln-btn.active{background:var(--red);color:#fff;box-shadow:0 3px 8px rgba(185,28,28,.2)}
.left-nav .ln-btn .ln-dot{position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%}
.left-nav .ln-btn .ln-tip{
  position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);
  padding:4px 8px;background:var(--ink);color:#fff;font-size:10px;
  border-radius:5px;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .15s;
}
.left-nav .ln-btn:hover .ln-tip{opacity:1}
.left-nav .ln-sep{width:16px;height:1px;background:var(--line);margin:2px 0}
.left-nav .ln-label{font-size:7px;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin:1px 0}

/* === PAGE === */
.page{max-width:800px;margin:0 auto;padding:80px 28px 60px}

/* === MASTHEAD === */
.masthead{text-align:center;padding:32px 0 20px;border-bottom:4px double var(--red);margin-bottom:32px}
.masthead .m-name{font-size:36px;font-weight:900;color:var(--red);letter-spacing:6px;font-family:"STSong","Songti SC","Noto Serif SC",serif}
.masthead .m-sub{font-size:11px;color:var(--muted);letter-spacing:3px;margin-top:2px}
.masthead .m-info{font-size:10px;color:#bbb;margin-top:6px;display:flex;justify-content:center;gap:16px}
.masthead .m-info span{letter-spacing:1px}

/* === EDITION (one per dept) === */
.edition{scroll-margin-top:100px;margin-bottom:40px;background:var(--paper);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.04)}
/* Edition header bar */
.edition .ed-header{background:var(--red);color:#fff;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:2px}
.edition .ed-header .ed-num{font-weight:700}
.edition .ed-header .ed-dept{font-weight:600}
/* Edition body */
.edition .ed-body{padding:24px 28px 18px}
/* Headline */
.edition .ed-headline{text-align:center;margin-bottom:14px}
.edition .ed-headline .ed-icon{font-size:32px;display:block;margin-bottom:2px}
.edition .ed-headline h2{font-size:24px;font-weight:900;color:var(--ink);letter-spacing:2px}
.edition .ed-headline .ed-subline{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;justify-content:center;gap:6px}
.edition .ed-headline .ed-subline::before,.edition .ed-headline .ed-subline::after{content:'';width:30px;height:1px;background:var(--line)}
/* Divider */
.edition .ed-divider{text-align:center;margin:14px 0;color:var(--line);font-size:8px;letter-spacing:4px}
/* Two-column body */
.edition .ed-columns{column-count:2;column-gap:28px;column-rule:1px solid var(--line-l);font-size:13px;line-height:2.1;color:#3a3a3a}
.edition .ed-columns p{margin-bottom:12px;text-indent:2em}
.edition .ed-columns .ed-label{font-weight:700;color:var(--red);text-indent:0;margin-top:6px;font-size:12px;break-before:avoid;break-after:avoid}
.edition .ed-columns .ed-label::before{content:'【';color:var(--muted);font-weight:400}.edition .ed-columns .ed-label::after{content:'】';color:var(--muted);font-weight:400}
/* Quote box */
.edition .ed-quote{border-left:3px solid var(--red);padding:8px 14px;background:var(--red-l);font-size:12px;color:var(--red);margin:12px 0;break-inside:avoid;font-style:italic;text-indent:0}
.edition .ed-quote::before{content:'" ';font-size:18px}.edition .ed-quote::after{content:' "';font-size:18px}
/* Personnel */
.edition .ed-personnel{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;margin-top:8px;break-inside:avoid}
.edition .ed-personnel .ep-card{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--warm);border-radius:4px;font-size:11px}
.edition .ed-personnel .ep-card .ep-av{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.edition .ed-personnel .ep-card .ep-name{font-weight:600}.edition .ed-personnel .ep-card .ep-role{font-size:9px;color:var(--muted)}
/* Module tags */
.edition .ed-modules{border-top:1px solid var(--line-l);margin-top:14px;padding-top:10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.edition .ed-modules .em-label{font-size:10px;color:var(--muted);letter-spacing:1px;margin-right:4px}
.edition .ed-modules .em-tag{font-size:10px;padding:3px 9px;border:1px solid var(--line);background:var(--paper);color:#555;border-radius:2px;transition:all .12s}
.edition .ed-modules .em-tag:hover{border-color:var(--red);color:var(--red)}
/* Edition footer */
.edition .ed-footer{border-top:1px solid var(--line);margin-top:14px;padding:6px 20px;display:flex;justify-content:space-between;font-size:9px;color:#ccc;letter-spacing:1px;background:var(--warm)}

/* === TOP ISSUE NAV === */
.issue-nav{display:flex;flex-wrap:wrap;gap:0;margin-bottom:28px;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.issue-nav .in-item{flex:1;min-width:60px;padding:8px 6px;text-align:center;cursor:pointer;font-size:10px;color:#888;border-right:1px solid var(--line-l);transition:all .12s;background:var(--paper);border-bottom:2px solid transparent}
.issue-nav .in-item:last-child{border-right:none}
.issue-nav .in-item:hover{background:var(--warm);color:var(--ink)}
.issue-nav .in-item.active{background:var(--red);color:#fff;border-bottom-color:var(--red);font-weight:600}
.issue-nav .in-item .in-icon{font-size:14px;display:block;margin-bottom:1px}

@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease-out}
</style>
</head>
<body>

<!-- TOP DOCK -->
<nav class="top-dock">
  <div class="tk-logo"><div class="tk-icon">元</div></div>
  <button class="tk-item"><span class="tk-icon">📊</span>项目看板</button>
  <button class="tk-item"><span class="tk-icon">📁</span>项目管理</button>
  <button class="tk-item"><span class="tk-icon">✅</span>任务中心<span class="tk-badge">5</span></button>
  <button class="tk-item"><span class="tk-icon">⚠</span>工单提交</button>
  <button class="tk-item act"><span class="tk-icon">💼</span>案例中心</button>
  <button class="tk-item"><span class="tk-icon">📢</span>信息广场<span class="tk-badge">3</span></button>
  <button class="tk-item"><span class="tk-icon">🔧</span>规范管理</button>
  <button class="tk-item"><span class="tk-icon">⚙</span>设置</button>
  <button class="tk-item"><span class="tk-icon">ℹ</span>关于</button>

</nav>

<!-- LEFT NAV -->
<div class="left-nav" id="left-nav">
  <button class="ln-btn" onclick="scrollToTop()" title="回到顶部">

  </button>
  <div class="ln-sep"></div>

</div>

<!-- PAGE -->
<div class="page" id="page">

  <!-- Masthead -->
  <div class="masthead">
    <div class="m-name">用户画像 · 科室档案</div>

    </div>
  </div>

  <!-- Issue navigation -->
  <div class="issue-nav" id="issue-nav"></div>

  <!-- All editions -->
  <div id="editions"></div>

</div>

<script>
const BAR="#b91c1c";
const DEPTS=[
  {code:"school_leader",n:"校领导",icon:"🏫",
    personnel:[{n:"张建国",r:"校长"},{n:"李明华",r:"副校长（教学）"}],
    dw:"统筹学校整体发展战略规划与信息化建设方向，负责全校行政管理和重大决策。\n\n制定学校中长期发展规划和年度工作计划，统筹全校教学、德育、后勤、安全等各条线工作。审批重大采购项目和信息化建设方案，对接上级主管部门，争取政策与资金支持。主持召开校务会议和行政办公会议，协调各部门工作。",
    wf:"校务会议（每周一）→ 部门工作汇报 → 问题协调 → 决策下发 → 跟踪督办。\n\n重大事项决策流程：部门提案 → 分管校长审核 → 校务会讨论 → 校长审批 → 办公室发文 → 执行跟踪与反馈。",
    pn:"数据分散在各个部门的Excel和独立系统中，校长无法实时掌握学校运行全貌。开会时各部门数据口径不一致，经常需要反复核对。缺乏统一的数据驾驶舱，决策依赖经验和直觉。上级主管部门要求的数据报表统计耗时，占用了大量行政资源。跨部门协同效率低，信息传递依赖微信和口头沟通。",
    ex:"建设统一的数据驾驶舱，一站式查看全校教学、德育、人事、财务、后勤等核心指标。实现各部门数据自动汇聚，减少手工统计工作量。建立跨部门协同工作平台，打破信息孤岛。支持移动端审批和查看，提升管理效率。对接上级教育管理平台，自动生成所需报表。",
    quote:"信息化不是买软件，是换一种工作方式。",
    mods:["数据大屏/驾驶舱","流程审批","数据可视化"]},
  {code:"academic_affairs",n:"教务处",icon:"📋",
    personnel:[{n:"王燕",r:"教务主任"},{n:"赵磊",r:"教务员"}],
    dw:"负责全校教学运行管理，包括课程编排、考务组织、学籍管理、教学质量监控和教师教学评价。\n\n编排全校课程表，协调教师、教室、时间资源。组织期中期末考试、补考、学业水平考试等各类考试。管理学生学籍档案、成绩档案，开展教学检查和教学质量评估，管理教材征订和教学资源。",
    wf:"学期初：排课 → 教材征订 → 教学计划审核。\n学期中：教学检查 → 听课评课 → 期中考试组织。\n学期末：期末考试 → 成绩分析 → 学籍归档 → 下学期排课准备。",
    pn:"排课冲突频发——教师、教室、时间三维约束下手工排课效率极低，平均需要2-3周才能完成。成绩分析耗时——每次考试后需要3-5天完成全年级成绩统计分析，且容易出错。巡课缺乏系统支撑——教学检查依赖人工巡课，无法系统记录和跟踪问题。学籍管理电子化程度低——部分档案仍为纸质，查询和统计不便。",
    ex:"智能排课系统——支持约束条件配置，自动生成最优课表。成绩管理与分析平台——自动统计、可视化展示、对接区级平台。在线巡课系统——支持移动端记录、拍照、评分和跟踪。电子学籍管理系统——全流程数字化。教学资源管理平台——统一管理课件、试卷、教学资料。",
    quote:"排课排得好，学期少烦恼。",
    mods:["课表中心","考务管理","成绩管理","在线巡课","教学质量","基础教务"]},
  {code:"teaching_research",n:"教研室",icon:"📚",
    personnel:[{n:"刘敏",r:"教研室主任"}],
    dw:"组织集体备课活动、开展教研课题研究、管理教学资源库。推动教师专业发展，组织公开课、示范课和教学竞赛。负责教学质量数据分析，为教学改进提供依据。统筹学校科研项目管理，组织教师参加学术交流和培训。",
    wf:"教研计划制定 → 集体备课组织 → 公开课/示范课开展 → 课题申报与结题管理 → 教学论文评选 → 教研成果归档与分享。",
    pn:"教研成果难以沉淀共享——好的教案、课件、教学反思分散在教师个人电脑中，无法形成学校级资源库。远程教研工具缺乏——跨校区教研依赖出差，疫情期间暴露了严重短板。课题研究过程管理粗放——申报、中期检查、结题等环节缺乏系统化支持。",
    ex:"教研资源库——统一存储、分类、检索全校教研成果，支持标签、评分、评论。在线协作平台——支持远程集体备课、实时文档协作、视频研讨。课题管理系统——全过程跟踪课题申报、研究进度、中期检查和结题验收。",

    dw:"负责学生日常管理、德育教育、班级考核、违纪处理、心理筛查与干预等工作。组织全校德育活动、主题班会、社会实践，推动学生综合素质评价体系建设。管理班主任队伍，开展家校沟通工作。",
    wf:"学期德育计划 → 主题班会安排 → 班级量化考核 → 违纪处理流程 → 心理筛查 → 综合素质评价 → 学期德育总结。",
    pn:"评价维度单一——当前德育评价以扣分为主，缺乏正向激励和过程性记录。数据采集依赖班主任手工填报——工作量大且容易遗漏。家校沟通渠道零散——微信群、电话、家长会之间信息不互通。学生心理筛查效率低——量表手工统计，危机预警缺乏系统支撑。",
    ex:"综合素质评价系统——多维度、过程性记录学生成长，支持教师、家长、学生多角色参与。德育管理平台——班级考核自动化、违纪处理流程化、德育活动在线管理。家校通平台——统一的家校沟通渠道，通知、问卷、成绩推送一体化。",

    wf:"需求收集 → 技术评估 → 方案设计 → 采购招标 → 项目实施 → 验收测试 → 运维保障。每学期进行信息化需求调研，制定下一年度信息化建设计划。",
    pn:"各部门系统孤立——教务处、学生处、后勤等部门各自采购系统，数据无法互通。数据标准不统一——同样的学生信息在不同系统中字段名称、格式各不相同。接口对接成本高——每次数据打通都需要与供应商协商，开发周期长、费用高。缺乏统一数据中台——无法实现全校数据资产的统一管理和利用。信息安全压力大——等保合规要求越来越高。",

const MODS_ALL=DEPTS.map(d=>d.mods);

// Build left nav with dept items
function buildLeftNav(){
  const nav=document.getElementById('left-nav');
  DEPTS.forEach((d,i)=>{
    const dotColor=d.code==='school_leader'||d.code==='academic_affairs'||d.code==='it_center'?'#16a34a':'#bbb';
    nav.innerHTML+=`<button class="ln-btn" onclick="document.getElementById('ed-${d.code}').scrollIntoView({behavior:'smooth',block:'start'})" title="${d.n}">
      <span class="ln-dot" style="background:${dotColor}"></span>${d.icon}
      <span class="ln-tip">第${String(i+1).padStart(2,'0')}期 · ${d.n}</span>
    </button>`;
  });
}

// Build issue nav at top
function buildIssueNav(){
  document.getElementById('issue-nav').innerHTML=DEPTS.map((d,i)=>`<div class="in-item" onclick="document.getElementById('ed-${d.code}').scrollIntoView({behavior:'smooth',block:'start'})">
    <span class="in-icon">${d.icon}</span>${d.n}
  </div>`).join('');
}

// Build all editions
function buildEditions(){
  document.getElementById('editions').innerHTML=DEPTS.map((d,i)=>`
    <div class="edition fade-in" id="ed-${d.code}">
      <div class="ed-header">
        <span class="ed-num">第 ${String(i+1).padStart(2,'0')} 期</span>
        <span class="ed-dept">${d.n} 专刊</span>
        <span>${MODS_ALL[i].length} 个模块</span>
      </div>
      <div class="ed-body">
        <div class="ed-headline">
          <span class="ed-icon">${d.icon}</span>
          <h2>${d.n}</h2>
          <div class="ed-subline">${d.code}</div>
        </div>
        <div class="ed-divider">◆ ◆ ◆</div>
        <div class="ed-columns">
          <p class="ed-label">日常核心工作</p>
          <p>${d.dw}</p>
          <p class="ed-label">业务流程</p>
          <p>${d.wf}</p>
          <p class="ed-label">当前痛点</p>
          <p>${d.pn}</p>
          <p class="ed-label">信息化期望</p>
          <p>${d.ex}</p>
          ${d.quote?`<div class="ed-quote">${d.quote}</div>`:''}
          ${d.personnel?`
            <p class="ed-label">科室人员</p>
            <div class="ed-personnel">${d.personnel.map(p=>`
              <div class="ep-card">
                <div class="ep-av">${p.n.charAt(0)}</div>
                <div><span class="ep-name">${p.n}</span><br><span class="ep-role">${p.r}</span></div>
              </div>`).join('')}</div>
          `:''}
        </div>
        <div class="ed-modules">
          <span class="em-label">匹配模块</span>
          ${MODS_ALL[i].map(m=>`<span class="em-tag">${m}</span>`).join('')}
        </div>
      </div>
      <div class="ed-footer">
        <span>本刊编辑：客户成功部</span>
        <span>${new Date().toLocaleDateString('zh-CN')}</span>
        <span>${i+1}/${DEPTS.length}</span>
      </div>
    </div>
  `).join('');
}

// Scroll spy for left nav
let ticking=false;
window.addEventListener('scroll',()=>{
  if(!ticking){ticking=true;requestAnimationFrame(()=>{ticking=false;updateActiveNav();});}
},{passive:true});

function updateActiveNav(){
  const btns=document.querySelectorAll('.left-nav .ln-btn');
  let active=0;
  DEPTS.forEach((d,i)=>{const el=document.getElementById('ed-'+d.code);if(el&&el.getBoundingClientRect().top<200)active=i;});
  btns.forEach((b,i)=>{if(i===0)return;b.classList.toggle('active',i===active+1);});
  // Issue nav
  document.querySelectorAll('.in-item').forEach((el,i)=>el.classList.toggle('active',i===active));
}

function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}

// Init
document.getElementById('today-date').textContent=new Date().toLocaleDateString('zh-CN');
buildLeftNav();
buildIssueNav();
buildEditions();

// Dock clicks
document.querySelectorAll('.top-dock .tk-item').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.top-dock .tk-item').forEach(x=>x.classList.remove('act'));this.classList.add('act');});});
</script>

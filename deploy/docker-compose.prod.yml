version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.prod
    container_name: proj-mgmt-app
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      - COZE_PROJECT_ENV=${COZE_PROJECT_ENV:-PROD}
      - NODE_ENV=production
      - PORT=${PORT:-5000}
      - HOSTNAME=0.0.0.0
      - COZE_WORKSPACE_PATH=/app
      # PostgreSQL
      - DATABASE_URL=postgresql://${PG_USER:-projmgmt}:${PG_PASSWORD}@postgres:5432/${PG_DB:-projmgmt}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      # S3 (optional)
      - COZE_BUCKET_ENDPOINT_URL=${COZE_BUCKET_ENDPOINT_URL:-}
      - COZE_BUCKET_NAME=${COZE_BUCKET_NAME:-}
      - COZE_BUCKET_ACCESS_KEY_ID=${COZE_BUCKET_ACCESS_KEY_ID:-}
      - COZE_BUCKET_SECRET_ACCESS_KEY=${COZE_BUCKET_SECRET_ACCESS_KEY:-}
    volumes:
      - app_uploads:/app/public/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-5000}',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: proj-mgmt-db
    environment:
      - POSTGRES_USER=${PG_USER:-projmgmt}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB:-projmgmt}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-projmgmt} -d ${PG_DB:-projmgmt}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
  app_uploads:
    driver: local

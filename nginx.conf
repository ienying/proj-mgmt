# Nginx 反向代理 + 静态资源直出
# 安装: apt install nginx
# 启用: cp nginx.conf /etc/nginx/sites-available/proj-mgmt && ln -s /etc/nginx/sites-available/proj-mgmt /etc/nginx/sites-enabled/

upstream proj_mgmt_backend {
    least_conn;
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 隐藏服务器版本信息（V8）
    server_tokens off;

    # 日志
    access_log /var/log/nginx/proj-mgmt-access.log;
    error_log /var/log/nginx/proj-mgmt-error.log;

    # 上传文件大小限制
    client_max_body_size 100M;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # API 请求代理到 Next.js
    location /api/ {
        proxy_pass http://proj_mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_hide_header X-Powered-By;  // V8
    }

    # 静态资源直接 serve（不经过 Node.js）
    location /_next/static {
        alias /home/opera/code/proj-mgmt-software/.next/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 上传文件直接 serve
    location /uploads/ {
        alias /home/opera/code/proj-mgmt-software/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 其他请求代理到 Next.js
    location / {
        proxy_pass http://proj_mgmt_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
